<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broad Board</title>
  <link rel="stylesheet" href="multimixi.css">
  <script src="patterns.js" defer></script>
  <script src="multimixi.js" defer></script>
</head>
<body>
  <h1>Broad Board</h1>
  <p class="hint">Hover any tile to highlight a 2×2 block. Click to rotate it 90° clockwise. Choose a target pattern and rearrange the tiles to match the preview.</p>

  <div class="boards-row">
    <div id="board-wrap">
      <div id="grid"></div>
    </div>

    <div id="preview-wrap">
      <div class="preview-label">Target</div>
      <div id="target-preview"></div>
    </div>
  </div>

  <div id="controls">
    <label for="patternSelect">Target:</label>
    <select id="patternSelect"></select>
    <button id="randomize">Randomize</button>
  </div>
  <div class="status" id="status"></div>
</body>
</html>
