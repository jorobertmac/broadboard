<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Broad Board</title>
  <link rel="stylesheet" href="multimixi.css">
  <!-- Pattern modules: generators first, then core catalog/loader -->
  <script src="patterns-gens-bw.js" defer></script>
  <script src="patterns-gens-color.js" defer></script>
  <script src="patterns-core.js" defer></script>
  <!-- Game modules: board → picker → game (boot) -->
  <script src="board.js" defer></script>
  <script src="picker.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <h1>Broad Board</h1>
  <p class="hint">Tap or click a tile to rotate its 2×2 block 90° clockwise. Pick a pattern (4×4 through 16×16, black &amp; white or color) — the board resizes and loads the matching tiles. Match the target.</p>

  <div class="boards-row">
    <div id="board-wrap">
      <div id="grid"></div>
    </div>

    <div id="preview-wrap">
      <div class="preview-label">Target</div>
      <div id="target-preview"></div>
    </div>
  </div>

  <div id="controls">
    <label id="patternPickerLabelText" for="patternPickerBtn">Target:</label>
    <div class="pattern-picker" id="patternPicker">
      <button type="button" class="pattern-picker-btn" id="patternPickerBtn"
              aria-haspopup="listbox" aria-expanded="false" aria-labelledby="patternPickerLabelText">
        <canvas class="pattern-thumb" id="patternPickerThumb" width="28" height="28" aria-hidden="true"></canvas>
        <span class="pattern-picker-label" id="patternPickerLabel">Loading…</span>
        <span class="pattern-picker-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="pattern-picker-menu" id="patternPickerMenu" hidden role="listbox" aria-label="Pattern list"></div>
    </div>
    <button type="button" id="randomize">Randomize</button>
  </div>
  <div class="status" id="status"></div>
</body>
</html>
